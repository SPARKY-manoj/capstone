<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Chicago Crime Analytics</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Dashboard</a>
            <a class="nav-link" href="/usecase1">Use Case 1</a>
            <a class="nav-link" href="/usecase2">Use Case 2</a>
            <a class="nav-link" href="/usecase3">Use Case 3</a>
            <a class="nav-link" href="/usecase4">Use Case 4</a>
            <a class="nav-link active" href="/crud">CRUD</a>
        </div>
    </div>
</nav>

<div class="container my-4">
    <h2>Crime Record CRUD Operations</h2>

    <div id="message"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header">Add / Update Crime Record</div>
        <div class="card-body">
            <form id="crimeForm">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">ID</label>
                        <input type="number" class="form-control" id="id" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Case Number</label>
                        <input type="text" class="form-control" id="caseNumber" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Date</label>
                        <input type="datetime-local" class="form-control" id="date" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Block</label>
                        <input type="text" class="form-control" id="block" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">IUCR Code</label>
                        <input type="number" class="form-control" id="iucrCode" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Primary Type</label>
                        <input type="text" class="form-control" id="primaryType" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Description</label>
                        <input type="text" class="form-control" id="description" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Location Description</label>
                        <input type="text" class="form-control" id="locationDesc" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Arrest</label>
                        <select class="form-select" id="arrest">
                            <option value="0">False</option>
                            <option value="1">True</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Domestic</label>
                        <select class="form-select" id="domestic">
                            <option value="0">False</option>
                            <option value="1">True</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Beat Number</label>
                        <input type="number" class="form-control" id="beatNum" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">District Code</label>
                        <input type="number" class="form-control" id="districtCode" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Ward Number</label>
                        <input type="number" class="form-control" id="wardNo" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Community Code</label>
                        <input type="number" class="form-control" id="communityCode" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">FBI Code</label>
                        <input type="text" class="form-control" id="fbiCode" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Year</label>
                        <input type="number" class="form-control" id="year" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Month</label>
                        <input type="number" min="1" max="12" class="form-control" id="month" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Day of Week</label>
                        <input type="text" class="form-control" id="dayofweek" required>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary" id="saveButton">Add Crime</button>
                    <button type="button" class="btn btn-secondary" id="cancelButton" onclick="resetForm()">Clear</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between">
            <span>Crime Records</span>
            <button class="btn btn-sm btn-dark" onclick="loadCrimes()">Refresh</button>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-striped table-sm">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Case Number</th>
                            <th>Date</th>
                            <th>Primary Type</th>
                            <th>Location</th>
                            <th>Arrest</th>
                            <th>Community</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="crimeTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/crud.js"></script>
</body>
</html>
